name: Test Suite - Activity Page

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser engine to execute activity tests against'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
          - edge

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  test-activity:
    name: Run Activity Page Suite & Update Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: |
          if [ "${{ github.event.inputs.browser }}" = "chromium" ]; then
            npx playwright install --with-deps chromium
          elif [ "${{ github.event.inputs.browser }}" = "firefox" ]; then
            npx playwright install --with-deps firefox
          elif [ "${{ github.event.inputs.browser }}" = "webkit" ]; then
            npx playwright install --with-deps webkit
          elif [ "${{ github.event.inputs.browser }}" = "edge" ]; then
            npx playwright install --with-deps msedge || npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps
            npx playwright install msedge || true
          fi

      - name: Run Activity Page Tests (Single Command Package)
        run: |
          if [ -n "${{ github.event.inputs.browser }}" ] && [ "${{ github.event.inputs.browser }}" != "all" ]; then
            npx playwright test src/tests/activity.spec.ts --project=${{ github.event.inputs.browser }} && npm run generate:dashboard
          else
            npm run test:activity
          fi
        env:
          CI: true

      - name: Archive Playwright HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-activity-report
          path: test-reports/html-report/
          retention-days: 14

      - name: Commit Updated Dashboard to Main
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html test-reports/
          git diff --staged --quiet || git commit -m "chore: update dashboard after Activity Page test suite [skip ci]"
          git push origin main || echo "Branch updated or push skipped"

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: Deploy Live Dashboard to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: test-activity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
