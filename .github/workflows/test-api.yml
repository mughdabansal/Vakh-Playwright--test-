name: "API Risk-Tiered & Security Test Suites"

on:
  schedule:
    # Dynamic schedule: automatically recalculated after every run
    # Next execution: Saturday, 31 Oct 2026 at 21:04 UTC (Sunday, 01 Nov 2026 at 02:34 IST)
    - cron: '4 21 * * 6'
  workflow_dispatch:
    inputs:
      tier:
        description: 'API Test Tier to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'tier1'
          - 'tier2'
          - 'tier3'
          - 'gotchas'
          - 'security'
          - 'perf'

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: "Vakh API Test Matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_UPDATE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers (for Request context)
        run: npx playwright install --with-deps chromium

      - name: Run Full API Test Suite (All Tiers)
        if: ${{ github.event.inputs.tier == 'all' || github.event.inputs.tier == '' || github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' }}
        run: npm run test:api:all

      - name: Run Tier 1 Critical Tests Only
        if: ${{ github.event.inputs.tier == 'tier1' }}
        run: npm run test:api:tier1

      - name: Run Tier 2 Core CRUD Tests Only
        if: ${{ github.event.inputs.tier == 'tier2' }}
        run: npm run test:api:tier2

      - name: Run Tier 3 Supporting Tests Only
        if: ${{ github.event.inputs.tier == 'tier3' }}
        run: npm run test:api:tier3

      - name: Run Gotchas Edge-Case Tests Only
        if: ${{ github.event.inputs.tier == 'gotchas' }}
        run: npm run test:api:gotchas

      - name: Run Security & SSRF Fuzzing Sweep Only
        if: ${{ github.event.inputs.tier == 'security' }}
        run: npm run test:api:security

      - name: Run Rate Limiting & Concurrency Benchmarks
        if: ${{ github.event.inputs.tier == 'all' || github.event.inputs.tier == 'perf' || github.event_name == 'schedule' }}
        run: npm run test:api:perf

      - name: Dynamically Reschedule Next API Test Run
        if: always()
        run: node scripts/dynamic-scheduler.js --workflow=test-api

      - name: Regenerate Team Quality & Performance Dashboard
        if: always()
        run: npm run generate:dashboard

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            test-reports/
            docs/
          retention-days: 14

      - name: Commit Updated Dashboard & Dynamic Schedule to Main
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_UPDATE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${WORKFLOW_TOKEN}@github.com/${{ github.repository }}.git"
          git add docs/ test-reports/ .github/workflows/test-api.yml
          git diff --staged --quiet || git commit -m "chore: auto-update API test results & dynamic schedule [skip ci]"
          git pull --rebase -X theirs origin main 2>/dev/null || (git rebase --abort 2>/dev/null && git pull origin main --strategy-option=theirs 2>/dev/null) || echo "Rebase resolved"
          npm run generate:dashboard
          git add docs/ test-reports/ .github/workflows/test-api.yml
          git diff --staged --quiet || git commit -m "chore: update dashboard timestamp & dynamic schedule [skip ci]" || true
          if ! git push origin main; then
            echo "::warning::Direct push including .github/workflows failed (likely default GITHUB_TOKEN lacks workflow scope). Falling back to committing test reports only."
            git reset HEAD .github/workflows/test-api.yml
            git checkout -- .github/workflows/test-api.yml
            git add docs/ test-reports/
            git diff --staged --quiet || git commit -m "chore: auto-update API test results & live dashboard [skip ci]" || true
            git push origin main || echo "Push skipped"
            echo "::notice::To enable dynamic automatic workflow rescheduling on GitHub Actions, add a repository secret named WORKFLOW_UPDATE_TOKEN with 'workflow' scope."
          else
            echo "✅ Dynamic schedule successfully pushed to main branch."
          fi

      - name: Setup GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: Deploy Live Dashboard to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
