name: Test Suite - Create Post & Poll

on:
  push:
    branches: [ main ]
    paths:
      - 'src/tests/post.spec.ts'
      - 'src/pages/PostComposerPage.ts'
      - '.github/workflows/test-post.yml'
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Test target to execute'
        required: true
        default: 'poll'
        type: choice
        options:
          - poll
          - all
      browser:
        description: 'Browser engine to execute tests against'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - all
          - firefox
          - webkit
          - edge

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  test-post:
    name: Run Post & Poll Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: |
          if [ "${{ github.event.inputs.browser }}" = "chromium" ] || [ -z "${{ github.event.inputs.browser }}" ]; then
            npx playwright install --with-deps chromium
          elif [ "${{ github.event.inputs.browser }}" = "firefox" ]; then
            npx playwright install --with-deps firefox
          elif [ "${{ github.event.inputs.browser }}" = "webkit" ]; then
            npx playwright install --with-deps webkit
          elif [ "${{ github.event.inputs.browser }}" = "edge" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps
          fi

      - name: Run Post / Poll Tests
        run: |
          BROWSER_ARG="--project=chromium"
          if [ -n "${{ github.event.inputs.browser }}" ] && [ "${{ github.event.inputs.browser }}" != "all" ]; then
            BROWSER_ARG="--project=${{ github.event.inputs.browser }}"
          elif [ "${{ github.event.inputs.browser }}" = "all" ]; then
            BROWSER_ARG=""
          fi

          if [ "${{ github.event.inputs.test_target }}" = "all" ]; then
            echo "⚡ Running Full Post Suite: src/tests/post.spec.ts $BROWSER_ARG"
            npx playwright test src/tests/post.spec.ts $BROWSER_ARG && npm run generate:dashboard
          else
            echo "⚡ Running Individual Poll Test: src/tests/post.spec.ts -g TC_POST_005 $BROWSER_ARG"
            npx playwright test src/tests/post.spec.ts -g "TC_POST_005" $BROWSER_ARG && npm run generate:dashboard
          fi
        env:
          CI: true

      - name: Archive Playwright HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-post-report
          path: test-reports/html-report/
          retention-days: 14

      - name: Commit Updated Dashboard to Main
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html test-reports/
          git diff --staged --quiet || git commit -m "chore: update dashboard after Post Creation Page test suite [skip ci]"
          git push origin main || echo "Branch updated or push skipped"

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: Deploy Live Dashboard to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: test-post
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
