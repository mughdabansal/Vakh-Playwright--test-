name: Playwright Tests & Dashboard Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  test:
    name: Run E2E Tests & Generate Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: |
          npx playwright install --with-deps
          npx playwright install msedge || true

      - name: Run Playwright Tests (Login & Navigation Suite)
        run: npm test
        env:
          CI: true

      - name: Regenerate Team Quality & Performance Dashboard
        run: npm run generate:dashboard

      - name: Archive Playwright HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: test-reports/html-report/
          retention-days: 14

      - name: Commit Updated Dashboard to Main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html LOGIN_PAGE_REPORT.txt
          git diff --staged --quiet || git commit -m "chore: auto-update dashboard & test metrics via CI [skip ci]"
          git push origin main || echo "Branch updated or push skipped"

      - name: Setup GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: Deploy Live Dashboard to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
