name: Load Testing Suite

on:
  schedule:
    # Dynamic schedule: automatically recalculated after every run
    # Next execution: Sunday, 01 Nov 2026 at 21:11 UTC (Monday, 02 Nov 2026 at 02:41 IST)
    - cron: '11 21 * * 0'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Load test scenario to execute'
        required: true
        default: 'ratelimit'
        type: choice
        options:
          - ratelimit
          - user-rate-limit
          - ip-rate-limit
          - identity-isolation
      mode:
        description: 'Execution mode'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - stress

permissions:
  contents: write
  actions: write

jobs:
  load-test:
    name: Load Test (${{ inputs.scenario || 'ratelimit' }} - ${{ inputs.mode || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_UPDATE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Authentication Secrets
        env:
          VAKH_TEST_EMAIL: ${{ secrets.VAKH_TEST_EMAIL }}
          VAKH_TEST_PASSWORD: ${{ secrets.VAKH_TEST_PASSWORD }}
        run: |
          echo "::add-mask::$VAKH_TEST_EMAIL"
          echo "::add-mask::$VAKH_TEST_PASSWORD"
          if [ -z "$VAKH_TEST_EMAIL" ] || [ -z "$VAKH_TEST_PASSWORD" ]; then
            echo "::error::Required repository secrets VAKH_TEST_EMAIL and/or VAKH_TEST_PASSWORD are not configured."
            echo "Please set VAKH_TEST_EMAIL and VAKH_TEST_PASSWORD under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "✅ Authentication secrets verified (presence confirmed without displaying values)."

      - name: Execute Load Testing Scenario
        env:
          VAKH_TEST_EMAIL: ${{ secrets.VAKH_TEST_EMAIL }}
          VAKH_TEST_PASSWORD: ${{ secrets.VAKH_TEST_PASSWORD }}
        run: |
          node performance/runner.js \
            --scenario=${{ inputs.scenario || 'ratelimit' }} \
            --mode=${{ inputs.mode || 'smoke' }}

      - name: Dynamically Reschedule Next Load Test Run
        if: always()
        run: node scripts/dynamic-scheduler.js --workflow=load-testing

      - name: Update Live Quality & Performance Dashboard
        if: always()
        run: npm run generate:dashboard

      - name: Commit Updated Dashboard, Load History & Dynamic Schedule to Main
        if: always() && github.ref == 'refs/heads/main'
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_UPDATE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${WORKFLOW_TOKEN}@github.com/${{ github.repository }}.git"
          git add docs/ test-reports/ .github/workflows/load-testing.yml
          git diff --staged --quiet || git commit -m "chore: auto-update load test results & dynamic schedule [skip ci]"
          git pull --rebase -X theirs origin main 2>/dev/null || (git rebase --abort 2>/dev/null && git pull origin main --strategy-option=theirs 2>/dev/null) || echo "Rebase resolved"
          npm run generate:dashboard
          git add docs/ test-reports/ .github/workflows/load-testing.yml
          git diff --staged --quiet || git commit -m "chore: update dashboard timestamp & dynamic schedule [skip ci]" || true
          if ! git push origin main; then
            echo "::warning::Direct push including .github/workflows failed (likely default GITHUB_TOKEN lacks workflow scope). Falling back to committing test reports only."
            git reset HEAD .github/workflows/load-testing.yml
            git checkout -- .github/workflows/load-testing.yml
            git add docs/ test-reports/
            git diff --staged --quiet || git commit -m "chore: auto-update load test results & live dashboard [skip ci]" || true
            git push origin main || echo "Push skipped"
            echo "::notice::To enable dynamic automatic workflow rescheduling on GitHub Actions, add a repository secret named WORKFLOW_UPDATE_TOKEN with 'workflow' scope."
          else
            echo "✅ Dynamic schedule successfully pushed to main branch."
          fi

      - name: Publish Scenario Summary to Job Summary
        if: always()
        run: |
          if [ -f test-reports/load/LOAD_TEST_REPORT.md ]; then
            cat test-reports/load/LOAD_TEST_REPORT.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for Inconclusive Scenario Notice
        if: always()
        run: |
          if [ -f test-reports/load/load-summary.json ]; then
            STATUS=$(node -e "try { const d = require('./test-reports/load/load-summary.json'); console.log(d.overallStatus || ''); } catch(e){}")
            SUMMARY_STR=$(node -e "try { const d = require('./test-reports/load/load-summary.json'); console.log(d.summaryString || ''); } catch(e){}")
            if [ "$STATUS" = "INCONCLUSIVE" ]; then
              echo "::warning::Load test completed with INCONCLUSIVE state ($SUMMARY_STR). Traffic was absorbed across edge isolates without SLO failure."
            fi
          fi

      - name: Upload Load Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vakh-load-test-${{ github.run_number }}
          path: |
            test-reports/load/LOAD_TEST_REPORT.md
            test-reports/load/load-summary.json
            test-reports/load/load-history.json
            test-reports/load/load-04a.json
            test-reports/load/load-04b.json
            test-reports/load/load-04c.json
          if-no-files-found: warn
          retention-days: 30
