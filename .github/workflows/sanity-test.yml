name: Versioned Sanity Test Suites (1.0, 2.0)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/pages/**'
      - 'src/tests/sanity/**'
      - 'src/config/**'
      - '.github/workflows/sanity-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/pages/**'
      - 'src/tests/sanity/**'
      - 'src/config/**'
      - '.github/workflows/sanity-test.yml'
  workflow_dispatch:
    inputs:
      suite_version:
        description: 'Sanity Suite Version to execute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '1.0'
          - '2.0'
      browser:
        description: 'Browser engine to run sanity suite against'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
          - edge

jobs:
  sanity-test:
    name: Run Versioned Sanity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & System Dependencies
        run: |
          if [ "${{ github.event.inputs.browser }}" = "chromium" ]; then
            npx playwright install --with-deps chromium
          elif [ "${{ github.event.inputs.browser }}" = "firefox" ]; then
            npx playwright install --with-deps firefox
          elif [ "${{ github.event.inputs.browser }}" = "webkit" ]; then
            npx playwright install --with-deps webkit
          elif [ "${{ github.event.inputs.browser }}" = "edge" ]; then
            npx playwright install --with-deps msedge || npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps
            npx playwright install msedge || true
          fi

      - name: Run Playwright Sanity Tests
        run: |
          PROJECT_ARG=""
          if [ -n "${{ github.event.inputs.browser }}" ] && [ "${{ github.event.inputs.browser }}" != "all" ]; then
            PROJECT_ARG="--project=${{ github.event.inputs.browser }}"
          fi

          if [ "${{ github.event.inputs.suite_version }}" = "1.0" ]; then
            echo "Executing Sanity 1.0 (Login & Explore): npm run test:sanity:1.0 -- $PROJECT_ARG"
            npm run test:sanity:1.0 -- $PROJECT_ARG
          elif [ "${{ github.event.inputs.suite_version }}" = "2.0" ]; then
            echo "Executing Sanity 2.0 (Posting & Moderation): npm run test:sanity:2.0 -- $PROJECT_ARG"
            npm run test:sanity:2.0 -- $PROJECT_ARG
          else
            echo "Executing All Sanity Suites: npm run test:sanity -- $PROJECT_ARG"
            npm run test:sanity -- $PROJECT_ARG
          fi
        env:
          CI: true

      - name: Generate Sanity Run Summary
        if: always()
        run: |
          echo "### 🚀 Versioned Sanity Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Sanity Suite Version**: \`${{ github.event.inputs.suite_version || 'all' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Sanity 1.0**: Login (\`login.spec.ts\`) & Explore (\`explore.spec.ts\`) — 13 Scenarios" >> $GITHUB_STEP_SUMMARY
          echo "- **Sanity 2.0**: Home Posting (\`posting.spec.ts\`) & Form Moderation (\`moderation.spec.ts\`) — 8 Scenarios" >> $GITHUB_STEP_SUMMARY
          echo "- **Selected Browser**: \`${{ github.event.inputs.browser || 'all' }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Archive Playwright HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanity-test-html-report
          path: test-reports/html-report/
          retention-days: 14
